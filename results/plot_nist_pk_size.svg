s-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">3.68 MB</text><text x="40.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">Level 1–2 parameter sets, bytes. NIST figures from official specifications (Falcon: average signature size).</text><text x="40.0" y="441.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">KNOT at paper-guided k = 256 (target λ = 128), packed TRI wire format (TRI-DESIGN notes §7.5): q = 2053, t = 271 slices, radix-coded signature.</text><text x="40.0" y="456.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">Research prototype — no security claim; the TRI assumptions are new and experimentally uncalibrated.</text></svg>