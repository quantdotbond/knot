<svg xmlns="http://www.w3.org/2000/svg" width="920" height="466" viewBox="0 0 920 466"><rect width="920" height="466" fill="#fcfcfb"/><title>Public key size — KNOT vs NIST signature schemes</title><text x="40.0" y="30.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Public key size — KNOT vs NIST signature schemes</text><text x="40.0" y="50.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Bytes, log scale · smaller is better</text><circle cx="70.0" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="70.0" cy="76.0" r="4" fill="#898781"/><text x="82.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">NIST standard</text><circle cx="199.2" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="199.2" cy="76.0" r="3" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="211.2" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Round-2 candidate</text><circle cx="354.0" cy="76.0" r="6" fill="#fcfcfb"/><path d="M 351.0 73.0 L 357.0 79.0 M 351.0 79.0 L 357.0 73.0" stroke="#898781" stroke-width="2" stroke-linecap="round" fill="none"/><text x="366.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Eliminated</text><circle cx="464.0" cy="76.0" r="7" fill="#fcfcfb"/><circle cx="464.0" cy="76.0" r="5" fill="#2a78d6"/><text x="476.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">KNOT — this work</text><line x1="210.0" y1="108" x2="210.0" y2="358" stroke="#e1e0d9" stroke-width="1"/><text x="210.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-seri