<svg xmlns="http://www.w3.org/2000/svg" width="920" height="466" viewBox="0 0 920 466"><rect width="920" height="466" fill="#fcfcfb"/><title>Signature size — KNOT vs NIST signature schemes</title><text x="40.0" y="30.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Signature size — KNOT vs NIST signature schemes</text><text x="40.0" y="50.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Bytes, log scale · smaller is better</text><circle cx="70.0" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="70.0" cy="76.0" r="4" fill="#898781"/><text x="82.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">NIST standard</text><circle cx="199.2" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="199.2" cy="76.0" r="3" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="211.2" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Round-2 candidate</text><circle cx="354.0" cy="76.0" r="6" fill="#fcfcfb"/><path d="M 351.0 73.0 L 357.0 79.0 M 351.0 79.0 L 357.0 73.0" stroke="#898781" stroke-width="2" stroke-linecap="round" fill="none"/><text x="366.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Eliminated</text><circle cx="464.0" cy="76.0" r="7" fill="#fcfcfb"/><circle cx="464.0" cy="76.0" r="5" fill="#2a78d6"/><text x="476.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">KNOT</text><line x1="210.0" y1="108" x2="210.0" y2="358" stroke="#e1e0d9" stroke-width="1"/><text x="210.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 B</text><line x1="545.0" y1="108" x2="545.0" y2="358" stroke="#e1e0d9" stroke-width="1"/><text x="545.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 kB</text><line x1="880.0" y1="108" x2="880.0" y2="358" stroke="#e1e0d9" stroke-width="1"/><text x="880.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 kB</text><line x1="206" y1="358" x2="880" y2="358" stroke="#c3c2b7" stroke-width="1"/><text x="880.0" y="396.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="end" font-weight="400">log scale →</text><text x="196.0" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400">MAYO-1</text><circle cx="430.1" cy="133.0" r="7" fill="#fcfcfb"/><circle cx="430.1" cy="133.0" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="444.1" y="137.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">454 B</text><text x="196.0" y="167.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400">HAWK-512</text><circle cx="459.3" cy="163.0" r="7" fill="#fcfcfb"/><circle cx="459.3" cy="163.0" r="4" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="473.3" y="167.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">555 B</text><text x="196.0" y="197.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400"><tspan font-weight="700">[NIST]</tspan> Falcon-512</text><circle cx="485.9" cy="193.0" r="7" fill="#fcfcfb"/><circle cx="485.9" cy="193.0" r="5" fill="#898781"/><text x="499.9" y="197.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">666 B</text><rect x="36" y="210.0" width="848" height="26" rx="4" fill="#2a78d6" opacity="0.07"/><text x="196.0" y="227.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">KNOT k=256</text><circle cx="499.4" cy="223.0" r="8" fill="#fcfcfb"/><circle cx="499.4" cy="223.0" r="6" fill="#2a78d6"/><text x="513.4" y="227.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">731 B</text><text x="196.0" y="257.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400">Wave</text><circle cx="516.5" cy="253.0" r="7" fill="#fcfcfb"/><path d="M 512.5 249.0 L 520.5 257.0 M 512.5 257.0 L 520.5 249.0" stroke="#898781" stroke-width="2" stroke-linecap="round" fill="none"/><text x="530.5" y="257.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">822 B</text><text x="196.0" y="287.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400"><tspan font-weight="700">[NIST]</tspan> ML-DSA-44</text><circle cx="673.6" cy="283.0" r="7" fill="#fcfcfb"/><circle cx="673.6" cy="283.0" r="5" fill="#898781"/><text x="687.6" y="287.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">2,420 B</text><text x="196.0" y="317.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400">LESS-1s</text><circle cx="784.9" cy="313.0" r="7" fill="#fcfcfb"/><path d="M 780.9 309.0 L 788.9 317.0 M 780.9 317.0 L 788.9 309.0" stroke="#898781" stroke-width="2" stroke-linecap="round" fill="none"/><text x="798.9" y="317.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">5,200 B</text><text x="196.0" y="347.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="end" font-weight="400"><tspan font-weight="700">[NIST]</tspan> SLH-DSA-128s</text><circle cx="844.9" cy="343.0" r="7" fill="#fcfcfb"/><circle cx="844.9" cy="343.0" r="5" fill="#898781"/><text x="830.9" y="347.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">7,856 B</text><text x="40.0" y="426.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">Level 1–2 parameter sets, bytes. NIST figures from official specifications (Falcon: average signature size).</text><text x="40.0" y="441.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">KNOT ALPHA ver. 1.2; experimentally uncalibrated.</text></svg>