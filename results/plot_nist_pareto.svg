<svg xmlns="http://www.w3.org/2000/svg" width="920" height="605" viewBox="0 0 920 605"><rect width="920" height="605" fill="#fcfcfb"/><title>Public key vs signature size: KNOT-TRI against NIST signature schemes</title><text x="40.0" y="30.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Public key vs signature size — KNOT-TRI on the NIST landscape</text><text x="40.0" y="50.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Both axes log scale · toward the lower left is better</text><circle cx="70.0" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="70.0" cy="76.0" r="4" fill="#898781"/><text x="82.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">NIST standard</text><circle cx="199.2" cy="76.0" r="6" fill="#fcfcfb"/><circle cx="199.2" cy="76.0" r="3" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="211.2" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Round-2 candidate</text><circle cx="354.0" cy="76.0" r="6" fill="#fcfcfb"/><path d="M 351.0 73.0 L 357.0 79.0 M 351.0 79.0 L 357.0 73.0" stroke="#898781" stroke-width="2" stroke-linecap="round" fill="none"/><text x="366.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Eliminated</text><circle cx="464.0" cy="76.0" r="7" fill="#fcfcfb"/><circle cx="464.0" cy="76.0" r="5" fill="#2a78d6"/><text x="476.0" y="80.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">KNOT — this work</text><line x1="206.7" y1="110" x2="206.7" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="206.7" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 B</text><line x1="343.3" y1="110" x2="343.3" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="343.3" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 kB</text><line x1="480.0" y1="110" x2="480.0" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="480.0" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 kB</text><line x1="616.7" y1="110" x2="616.7" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="616.7" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">100 kB</text><line x1="753.3" y1="110" x2="753.3" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="753.3" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">1 MB</text><line x1="890.0" y1="110" x2="890.0" y2="480" stroke="#e1e0d9" stroke-width="1"/><text x="890.0" y="498.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">10 MB</text><line x1="70" y1="480.0" x2="890" y2="480.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="484.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="end" font-weight="400">100 B</text><line x1="70" y1="295.0" x2="890" y2="295.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="299.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781" text-anchor="end" font-weight="400">1 kB</text><line x1="70" y1="110.0" x2="890" y2="110.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="114.0" font-family="sy